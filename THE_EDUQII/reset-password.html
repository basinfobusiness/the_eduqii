<!doctype html>
<html lang="en" data-bs-theme="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reset Password — Eduqii Class</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../assets/js/color-modes.js"></script>
    <style>
      body { padding-top: 3rem; }
      .reset-card { max-width: 520px; margin: auto; }
    </style>
  </head>
  <body>
    <main class="container py-5">
      <div class="reset-card">
        <h1 class="mb-3">Create a new password</h1>
        <p class="text-muted" id="resetMessage">Enter a new password for your account.</p>

        <div id="alertPlaceholder"></div>

        <form id="resetForm" class="card p-4">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <p id="emailDisplay" class="fw-semibold"></p>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">New password</label>
            <input id="password" name="password" type="password" class="form-control" minlength="6" required>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm new password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" minlength="6" required>
          </div>

          <div class="d-flex justify-content-between align-items-center gap-2">
            <a href="login.html" class="btn btn-outline-secondary">Back to sign in</a>
            <button type="submit" class="btn btn-primary">Reset password</button>
          </div>
        </form>
      </div>
    </main>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js';
      import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js';

      const firebaseConfig = {
        apiKey: "AIzaSyACb__eSwHJtPYka1GK7HuAc8mtDXX9eLw",
        authDomain: "eduqii.firebaseapp.com",
        projectId: "eduqii",
        databaseURL: "https://eduqii-default-rtdb.firebaseio.com",
        storageBucket: "eduqii.firebasestorage.app",
        messagingSenderId: "885827252573",
        appId: "1:885827252573:web:67cacd487a2c902a9138b4",
        measurementId: "G-D01VEZY342"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const form = document.getElementById('resetForm');
      const alertPlaceholder = document.getElementById('alertPlaceholder');
      const emailDisplay = document.getElementById('emailDisplay');
      const resetMessage = document.getElementById('resetMessage');

      function showAlert(message, type = 'success') {
        alertPlaceholder.innerHTML = `
          <div class="alert alert-${type} alert-dismissible" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        `;
      }

      function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      async function initializeReset() {
        const oobCode = getQueryParam('oobCode');
        const mode = getQueryParam('mode');

        if (!oobCode || mode !== 'resetPassword') {
          showAlert('This page was opened without a valid password reset link.', 'warning');
          form.querySelector('button[type="submit"]').disabled = true;
          resetMessage.textContent = 'Open the link from your reset email to continue.';
          return;
        }

        try {
          const email = await verifyPasswordResetCode(auth, oobCode);
          emailDisplay.textContent = email;
          resetMessage.textContent = 'Enter a new password for your account.';
        } catch (error) {
          console.error(error);
          showAlert('Invalid or expired reset link. Request a new reset email.', 'danger');
          form.querySelector('button[type="submit"]').disabled = true;
          resetMessage.textContent = 'Request a new reset email from the forgot password page.';
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const oobCode = getQueryParam('oobCode');
        const password = form.password.value;
        const confirmPassword = form.confirmPassword.value;

        if (password !== confirmPassword) {
          showAlert('Passwords do not match. Please confirm your new password.', 'warning');
          return;
        }

        if (password.length < 6) {
          showAlert('Password must be at least 6 characters.', 'warning');
          return;
        }

        try {
          await confirmPasswordReset(auth, oobCode, password);
          showAlert('Your password has been reset successfully. Redirecting to sign in...', 'success');
          setTimeout(() => window.location.href = 'login.html', 1800);
        } catch (error) {
          console.error(error);
          switch (error.message) {
            case 'Firebase: Error (auth/expired-action-code)':
            case 'Firebase: Error (auth/invalid-action-code)':
              showAlert('The reset link is invalid or expired. Request a new one.', 'danger');
              break;
            case 'Firebase: Error (auth/weak-password)':
              showAlert('Password is too weak. Choose a stronger password.', 'warning');
              break;
            default:
              showAlert('Unable to reset password. Please try again.', 'danger');
          }
        }
      });

      initializeReset();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
