<!doctype html>
<html lang="en" data-bs-theme="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Forgot Password — Eduqii Class</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../assets/js/color-modes.js"></script>
    <style>
      body { padding-top: 3rem; }
      .forgot-card { max-width: 520px; margin: auto; }
    </style>
  </head>
  <body>
    <main class="container py-5">
      <div class="forgot-card">
        <h1 class="mb-3">Reset your password</h1>
        <p class="text-muted">Enter the email address for your account and we'll send a password reset link.</p>

        <div id="alertPlaceholder"></div>

        <form id="forgotForm" class="card p-4">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" name="email" type="email" class="form-control" required>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="login.html" class="btn btn-outline-secondary">Back to sign in</a>
            <button type="submit" class="btn btn-primary">Send reset link</button>
          </div>
        </form>
      </div>
    </main>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js';
      import { getAuth, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js';

      const firebaseConfig = {
        apiKey: "AIzaSyACb__eSwHJtPYka1GK7HuAc8mtDXX9eLw",
        authDomain: "eduqii.firebaseapp.com",
        projectId: "eduqii",
        databaseURL: "https://eduqii-default-rtdb.firebaseio.com",
        storageBucket: "eduqii.firebasestorage.app",
        messagingSenderId: "885827252573",
        appId: "1:885827252573:web:67cacd487a2c902a9138b4",
        measurementId: "G-D01VEZY342"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const actionCodeSettings = {
        url: 'https://eduqii-fad6f.web.app/reset-password.html',
        handleCodeInApp: false,
      };

      const form = document.getElementById('forgotForm');
      const alertPlaceholder = document.getElementById('alertPlaceholder');

      function showAlert(message, type = 'success') {
        alertPlaceholder.innerHTML = `
          <div class="alert alert-${type} alert-dismissible" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        `;
      }

      function escapeHtml(str){
        if (!str && str !== '') return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;')
          .replace(/`/g, '&#96;');
      }

      async function getOrCreateCryptoKey(){
        const keyName = 'eduqii_crypto_key_v1';
        const stored = sessionStorage.getItem(keyName);
        if (stored) {
          const raw = Uint8Array.from(atob(stored), c => c.charCodeAt(0));
          return crypto.subtle.importKey('raw', raw.buffer, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
        }
        const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
        const exported = await crypto.subtle.exportKey('raw', key);
        const b64 = btoa(String.fromCharCode.apply(null, new Uint8Array(exported)));
        sessionStorage.setItem(keyName, b64);
        return key;
      }

      async function encryptString(plain){
        if (plain == null) return null;
        const key = await getOrCreateCryptoKey();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const enc = new TextEncoder().encode(plain);
        const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc);
        const ivStr = btoa(String.fromCharCode.apply(null, iv));
        const ctStr = btoa(String.fromCharCode.apply(null, new Uint8Array(cipher)));
        return ivStr + ':' + ctStr;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const rawEmail = form.email.value.trim();
        const emailEsc = escapeHtml(rawEmail);

        try {
          try {
            const encryptedEmail = await encryptString(emailEsc);
            sessionStorage.setItem('eduqii_forgot_email_enc_v1', encryptedEmail);
          } catch (cryptoErr) {
            console.warn('Encryption failed; continuing without storing encrypted copy', cryptoErr);
          }

          await sendPasswordResetEmail(auth, rawEmail, actionCodeSettings);
          showAlert('Password reset email sent. Check your inbox.', 'success');
          form.reset();
        } catch (err) {
          console.error(err);
          const code = err.code || err.message || '';
          switch (code) {
            case 'auth/user-not-found':
            case 'Firebase: Error (auth/user-not-found)':
              showAlert('No account found with that email.', 'warning');
              break;
            case 'auth/invalid-email':
            case 'Firebase: Error (auth/invalid-email)':
              showAlert('Invalid email format. Please check and try again.', 'warning');
              break;
            case 'auth/too-many-requests':
            case 'Firebase: Error (auth/too-many-requests)':
              showAlert('Too many requests. Please try again later.', 'danger');
              break;
            case 'auth/invalid-continuation-domain':
            case 'Firebase: Error (auth/invalid-continuation-domain)':
              showAlert('Reset page domain not authorized. Add eduqii-fad6f.web.app to Firebase Auth authorized domains.', 'danger');
              break;
            case 'auth/network-request-failed':
            case 'Firebase: Error (auth/network-request-failed)':
              showAlert('Network error. Please check your connection and try again.', 'danger');
              break;
            default:
              showAlert(`Unable to send reset email. ${code || 'Try again later.'}`, 'danger');
          }
        }
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
