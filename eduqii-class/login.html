<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Login — Eduqii Class</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="../assets/js/color-modes.js"></script>
  <style>
    body { padding-top: 3rem; }
    .login-card { max-width: 480px; margin: auto; }
  </style>
</head>
<body>
  <main class="container py-5">
    <div class="login-card">
      <h1 class="mb-3">Student Login</h1>
      <p class="text-muted">Sign in with the email and password you registered with.</p>

      <div id="alertPlaceholder"></div>

      <form id="loginForm" class="card p-4">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" class="form-control" required>
        </div>
        <div class="mb-2">
          <a href="forgot-password.html" class="small">Forgot password?</a>
        </div>

        <div class="d-flex justify-content-between align-items-center gap-2">
          <a href="signup.html" class="btn btn-outline-secondary">Create account</a>
          <button type="submit" class="btn btn-primary">Sign In</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyACb__eSwHJtPYka1GK7HuAc8mtDXX9eLw",
      authDomain: "eduqii.firebaseapp.com",
      projectId: "eduqii",
      databaseURL: "https://eduqii-default-rtdb.firebaseio.com",
      storageBucket: "eduqii.firebasestorage.app",
      messagingSenderId: "885827252573",
      appId: "1:885827252573:web:67cacd487a2c902a9138b4",
      measurementId: "G-D01VEZY342"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById('loginForm');
    const alertPlaceholder = document.getElementById('alertPlaceholder');

    function showAlert(message, type = 'success') {
      alertPlaceholder.innerHTML = `
        <div class="alert alert-${type} alert-dismissible" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      `;
    }

    // --- Escape helper to avoid injected markup when storing/displaying values ---
    function escapeHtml(str){
      if (!str && str !== '') return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/`/g, '&#96;');
    }

    // --- Crypto helpers: store ephemeral AES key in sessionStorage ---
    async function getOrCreateCryptoKey(){
      const keyName = 'eduqii_crypto_key_v1';
      const stored = sessionStorage.getItem(keyName);
      if (stored) {
        const raw = Uint8Array.from(atob(stored), c => c.charCodeAt(0));
        return crypto.subtle.importKey('raw', raw.buffer, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
      }
      const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
      const exported = await crypto.subtle.exportKey('raw', key);
      const b64 = btoa(String.fromCharCode.apply(null, new Uint8Array(exported)));
      sessionStorage.setItem(keyName, b64);
      return key;
    }

    async function encryptString(plain){
      if (plain == null) return null;
      const key = await getOrCreateCryptoKey();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = new TextEncoder().encode(plain);
      const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc);
      const ivStr = btoa(String.fromCharCode.apply(null, iv));
      const ctStr = btoa(String.fromCharCode.apply(null, new Uint8Array(cipher)));
      return ivStr + ':' + ctStr;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const rawEmail = form.email.value.trim();
      const rawPassword = form.password.value;

      // Escape values for safe storage/display; do NOT use escaped password for authentication
      const emailEsc = escapeHtml(rawEmail);

      try {
        // encrypt escaped email and store encrypted copy in sessionStorage BEFORE authenticating
        try {
          const encryptedEmail = await encryptString(emailEsc);
          sessionStorage.setItem('eduqii_login_email_enc_v1', encryptedEmail);
        } catch (cryptoErr) {
          console.warn('Encryption failed, continuing without storing encrypted copy', cryptoErr);
        }

        // proceed with authentication using raw credentials (Firebase requires plaintext email/password)
        await signInWithEmailAndPassword(auth, rawEmail, rawPassword);
        showAlert('Login successful. Redirecting to your lessons...', 'success');
        setTimeout(() => {
          window.location.href = '../enrolpage.html';
        }, 1200);
      } catch (error) {
        switch(error.message) {
          case 'Firebase: Error (auth/user-not-found)':
            showAlert('No account found with this email. Please sign up first.', 'warning');
            break;
          case 'Firebase: Error (auth/wrong-password)':
            showAlert('Incorrect password. Please try again.', 'warning');
            break;
          case 'Firebase: Error (auth/invalid-email)':
            showAlert('Invalid email format. Please check your email.', 'warning');
            break;
          case 'Firebase: Error (auth/too-many-requests)':
            showAlert('Too many failed login attempts. Please try again later.', 'danger');
            break;
            case 'Firebase: Error (auth/invalid-login-credentials).':
            showAlert('Invalid login credentials. Please check your email and password.', 'danger');
            break;
          default:
            showAlert('Unable to sign in. Please check your credentials.', 'danger');
        }
      }
    });
  </script>
</body>
</html>
